services:
  # ---- PostgreSQL for multi-tenant data ----
  openclaw-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${OPENCLAW_DB_NAME:-openclaw}
      POSTGRES_USER: ${OPENCLAW_DB_USER:-openclaw}
      POSTGRES_PASSWORD: ${OPENCLAW_DB_PASSWORD:-openclaw_secret}
    volumes:
      - openclaw-pgdata:/var/lib/postgresql/data
    ports:
      - "${OPENCLAW_DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENCLAW_DB_USER:-openclaw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Matter engine (team-pivot-web / Agenora OS matter governance) ----
  matter-engine:
    build:
      context: ../team-pivot-web
      dockerfile: ../EnClaws/matter-engine/Dockerfile
    environment:
      # Feishu OAuth (required; replace with real values or leave placeholder for local dev)
      FEISHU_APP_ID: ${FEISHU_APP_ID:-placeholder}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-placeholder}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://localhost:8001/api/auth/feishu/callback}
      SESSION_SECRET: ${MATTER_SESSION_SECRET:-change-me-to-a-long-random-secret}
      DATA_DIR: /data
      # CORS: matter engine only allows one origin; set to EC UI origin if needed.
      # In iframe mode the React app inside the iframe fetches back to port 8001
      # (same origin), so this value only matters for direct browser-to-8001 access.
      WEB_DEV_ORIGIN: ${MATTER_WEB_DEV_ORIGIN:-http://localhost:5173}
    volumes:
      - matter-engine-data:/data
    ports:
      - "${MATTER_ENGINE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8001), timeout=3)\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    depends_on:
      openclaw-db:
        condition: service_healthy
      matter-engine:
        condition: service_healthy
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      # Multi-tenant database
      OPENCLAW_DB_URL: postgresql://${OPENCLAW_DB_USER:-openclaw}:${OPENCLAW_DB_PASSWORD:-openclaw_secret}@openclaw-db:5432/${OPENCLAW_DB_NAME:-openclaw}
      OPENCLAW_JWT_SECRET: ${OPENCLAW_JWT_SECRET:-change-me-to-a-long-random-secret}
      # Matter engine proxy config
      MATTER_ENGINE_URL: ${MATTER_ENGINE_URL:-http://matter-engine:8001}
      MATTER_ENGINE_PAT: ${MATTER_ENGINE_PAT:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

volumes:
  openclaw-pgdata:
  matter-engine-data:
